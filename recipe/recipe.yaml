context:
  version: "2026.06.04"

package:
  name: quickjs
  version: ${{ version }}

source:
  url: https://bellard.org/quickjs/quickjs-${{ version | replace(".", "-") }}.tar.xz
  sha256: b376e839b322978313d929fd20663b11ba58b75df5a46c126dd19ea2fa70ad2a
  patches:
    - cross-compile.patch

build:
  number: 0
  skip:
    - win
  script:
    - make -j${CPU_COUNT} CC="${CC}" PREFIX="${PREFIX}"
    - if [[ "${CONDA_BUILD_CROSS_COMPILATION:-0}" != "1" ]]; then make test CC="${CC}"; fi
    - make install PREFIX="${PREFIX}"

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make

tests:
  - script:
      - qjs -e "console.log('hello')"
  - package_contents:
      bin:
        - qjs
        - qjsc
      include:
        - quickjs/quickjs.h
        - quickjs/quickjs-libc.h
      files:
        - lib/quickjs/libquickjs.a

about:
  homepage: https://bellard.org/quickjs/
  summary: A small and embeddable JavaScript engine
  description: |
    QuickJS is a small and embeddable JavaScript engine. It supports the
    ES2025 specification including modules, asynchronous generators,
    proxies and BigInt.
  license: MIT
  license_file: LICENSE
  repository: https://github.com/bellard/quickjs

extra:
  recipe-maintainers:
    - chrisburr
